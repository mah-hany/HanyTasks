<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>Hany Tasks — نظام إدارة المهام المؤسسي</title>
  <meta name="description" content="Hany Tasks — Enterprise Task Management System for organizations">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A5F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body class="mat-typography">
  <!-- ⚡ Instant theme restore — must run before Angular boots -->
  <script>
    (function() {
      var t = localStorage.getItem('tf_theme');
      if (t === 'dark') document.body.classList.add('dark-theme');
    })();
  </script>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
